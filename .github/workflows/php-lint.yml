name: Project checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Run project checks
        run: |
          bash repo-run.sh ci

      - name: Build package manifest
        run: |
          bash repo-run.sh package-manifest

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logcleaner-package
          path: |
            build/logcleaner-*.tar.gz
            build/logcleaner-*.tar.gz.sha256
            build/logcleaner-*.contents.txt
          if-no-files-found: error
