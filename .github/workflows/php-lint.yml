name: PHP lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Lint PHP files
        run: |
          find . -type f -name '*.php' -print0 | xargs -0 -n 1 php -l

      - name: Validate route targets
        run: |
          php tools/validate-routes.php

      - name: Validate localization JSON
        run: |
          find l10n -type f -name '*.json' -print0 | xargs -0 -n 1 python3 -m json.tool > /dev/null
